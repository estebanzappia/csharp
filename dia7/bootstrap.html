<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo del Kiosco</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons para iconos modernos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

  <!-- Barra de navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-shop me-2"></i>Kiosco Express</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Ofertas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <main class="container my-5">
    
    <!-- Encabezado de sección -->
    <div class="row align-items-center mb-4">
      <div class="col-md-6">
        <h1 class="h2 text-dark fw-bold m-0">Catálogo de Productos</h1>
        <p class="text-muted m-0">Gestiona y visualiza el stock disponible</p>
      </div>
      <div class="col-md-6 text-md-end mt-3 mt-md-0">
        <button type="button" class="btn btn-primary shadow-sm">
          <i class="bi bi-plus-circle me-1"></i> Agregar producto
        </button>
      </div>
    </div>

    <div class="row g-4">
      <!-- Columna Izquierda: Tabla de Productos -->
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-0">
            <div class="table-responsive m-0">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                  <tr>
                    <th class="py-3 ps-3">Producto</th>
                    <th class="py-3 text-end pe-3">Precio</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td class="ps-3 fw-medium">Gaseosa 500 ml</td>
                    <td class="text-end pe-3 fw-bold text-success">6.000 Gs</td>
                  </tr>
                  <tr>
                    <td class="ps-3 fw-medium">Alfajor</td>
                    <td class="text-end pe-3 fw-bold text-success">3.500 Gs</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Columna Derecha: Oferta y Resumen -->
      <div class="col-lg-4">
        <!-- Tarjeta de Oferta del día -->
        <div class="card border-0 shadow-sm bg-warning bg-opacity-10 border-start border-warning border-4">
          <div class="card-body">
            <h5 class="card-title text-dark fw-bold mb-2">
              <i class="bi bi-tag-fill text-warning me-1"></i> Oferta del día
            </h5>
            <p class="card-text text-secondary mb-3">Alfajor a precio promocional de <strong>3.000 Gs</strong> vigente hasta las 18:00.</p>
            <button class="btn btn-outline-dark btn-sm w-100">Aprovechar oferta</button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
